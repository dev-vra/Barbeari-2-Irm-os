version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: barber_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber123
      POSTGRES_DB: barberdb
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: barber_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
